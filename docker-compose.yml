services:
  app:
    build: .
    image: sto-crm:local
    container_name: sto-crm-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://user:password@db:5432/sto_crm?sslmode=disable
      JWT_SECRET: change-me-in-production-secret-key
      SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"

  tls:
    build: ./deploy/tls-proxy
    image: sto-crm-tls:local
    container_name: sto-crm-tls
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TLS_SAN: "IP:185.239.142.94,DNS:localhost"
    ports:
      - "8443:8443"
    volumes:
      - sto_crm_tls:/etc/nginx/certs

  db:
    image: postgres:16
    container_name: sto-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sto_crm
    ports:
      - "5432:5432"
    volumes:
      - sto_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sto_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sto_crm_pgdata:
  sto_crm_tls:
